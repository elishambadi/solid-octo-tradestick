{% extends "trading_journal/base.html" %}
{% block title %}Delete Journal Entry{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Delete Journal Entry</h1>
    
    <div class="confirmation-box">
        <p>Are you sure you want to delete the journal entry from {{ entry.date }}?</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn danger">Delete</button>
                <a href="{% url 'journal_entry_list' %}" class="btn secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
