version: '3.8'

name: forex-journal

services:
  postgres:
    image: postgres:13
    container_name: forex-journal-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forex-journal-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    networks:
      - forex-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: forex_journal_postgres_data

networks:
  forex-network:
    driver: bridge
